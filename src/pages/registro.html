<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Registro | Citri-Fresh</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
    <div class="auth-page">
        <!-- Botón Volver Flotante -->
        <a href="inicio.html" class="auth-back-btn">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
            <span>Volver al Inicio</span>
        </a>
        
        <div class="auth-card-split" style="max-width: 680px;">
            <div class="auth-form-side" style="padding: 2.75rem 3rem;">
                <div class="auth-brand-badge" style="justify-content: center; margin-bottom: 1rem;">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUboCZ5aHR_9JEHTrgIXyfPcAx97feojrkrVUt-ocYuzC0jtZZXHSDsG6_88cbfZ46ZyK2wFNyn81Fn5HtjRASwBANXl6uPmEI9eubj_fMqrCXx-w2kjBsq1TNMP0ka2xmPpBH9bo-uaN-Z1BychBk59HZbwlJLMe8lWGRo4UURbh10qs7BqlNCl0qF8sqLJs8MstsKEGRy4W7f89sXwWsdFRTmLLGKwakV9vsYRQIjlFrd53-59E-DZ3eApLYLvtUXg"
                        alt="Citri-Fresh Logo" class="auth-logo-main">
                </div>

                <div class="auth-heading-wrap" style="text-align: center; margin-bottom: 1.5rem;">
                    <h1 class="auth-title" style="font-size: 1.75rem;">Crea tu Cuenta</h1>
                    <p class="auth-subtitle">Únete a la principal red de comercio cítrico en Nicaragua.</p>
                </div>
                
                <form class="auth-form" action="auth/login.html">
                    <p style="font-size: 0.8125rem; font-weight: 700; color: var(--color-text-dark); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem;">Tipo de Perfil</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem;">
                        <label style="border: 1.5px solid var(--color-border); padding: 0.75rem; border-radius: 12px; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; background: var(--color-surface-gray); font-size: 0.875rem; font-weight: 600;">
                            <input type="radio" name="role" value="cliente" checked style="accent-color: var(--color-primary-container);">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--color-primary-container);">shopping_cart</span>
                            <span>Comprador</span>
                        </label>
                        <label style="border: 1.5px solid var(--color-border); padding: 0.75rem; border-radius: 12px; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; background: var(--color-surface-gray); font-size: 0.875rem; font-weight: 600;">
                            <input type="radio" name="role" value="productor" style="accent-color: var(--color-primary-container);">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--color-accent);">agriculture</span>
                            <span>Productor</span>
                        </label>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <div class="form-field-group" style="margin-bottom: 0;">
                            <label class="form-field-label">Nombres</label>
                            <div class="input-icon-wrapper">
                                <input type="text" class="auth-input-modern" placeholder="Carlos" required>
                                <span class="material-symbols-outlined field-icon">person</span>
                            </div>
                        </div>
                        <div class="form-field-group" style="margin-bottom: 0;">
                            <label class="form-field-label">Apellidos</label>
                            <div class="input-icon-wrapper">
                                <input type="text" class="auth-input-modern" placeholder="Mendoza" required>
                                <span class="material-symbols-outlined field-icon">badge</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-field-group">
                        <label class="form-field-label">Correo Electrónico</label>
                        <div class="input-icon-wrapper">
                            <input type="email" class="auth-input-modern" placeholder="carlos@ejemplo.com" required>
                            <span class="material-symbols-outlined field-icon">mail</span>
                        </div>
                    </div>
                    
                    <div class="form-field-group">
                        <label class="form-field-label">Contraseña</label>
                        <div class="input-icon-wrapper">
                            <input type="password" class="auth-input-modern" placeholder="Mínimo 8 caracteres" required>
                            <span class="material-symbols-outlined field-icon">lock</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-auth-submit" style="margin-top: 0.5rem;">
                        <span>Registrarse</span>
                        <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
                    </button>
                </form>
                
                <div class="auth-bottom-text" style="margin-top: 1.25rem;">
                    ¿Ya tienes una cuenta? <a href="auth/login.html" class="auth-link-highlight">Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
