<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta — CitriFresh</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card-split">
        <main class="auth-form-side">
          <h1>Crear Cuenta</h1>

          <form id="register-form">
            <div class="input-group">
              <label for="fullname" class="input-label">Nombre completo</label>
              <input
                type="text"
                id="fullname"
                class="input-field"
                placeholder="Ingresa tu nombre y apellido"
                required
              />
            </div>

            <div class="input-group">
              <label for="email" class="input-label">Dirección de correo</label>
              <input
                type="email"
                id="email"
                class="input-field"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="location" class="input-label">Ubicación</label>
              <select id="location" class="input-field" required>
                <option value="" disabled selected>
                  Selecciona tu departamento
                </option>
                <option value="boaco">Boaco</option>
                <option value="carazo">Carazo</option>
                <option value="chinandega">Chinandega</option>
                <option value="chontales">Chontales</option>
                <option value="esteli">Estelí</option>
                <option value="granada">Granada</option>
                <option value="jinotega">Jinotega</option>
                <option value="leon">León</option>
                <option value="madriz">Madriz</option>
                <option value="managua">Managua</option>
                <option value="masaya">Masaya</option>
                <option value="matagalpa">Matagalpa</option>
                <option value="nueva-segovia">Nueva Segovia</option>
                <option value="riva">Rivas</option>
                <option value="rio-san-juan">Río San Juan</option>
                <option value="raccn">RACCN</option>
                <option value="raccs">RACCS</option>
              </select>
            </div>

            <div class="input-group">
              <label for="password" class="input-label">Contraseña</label>
              <input
                type="password"
                id="password"
                class="input-field"
                placeholder="Crea tu contraseña"
                required
              />
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="terms" required />
              <label for="terms">
                Acepto los
                <a
                  href="#"
                  style="
                    color: var(--color-naranja);
                    text-decoration: underline;
                  "
                  >términos y políticas</a
                >
              </label>
            </div>

            <button type="submit" class="btn-submit">Registrarme</button>
          </form>

          <p class="auth-footer" style="margin-top: 20px">
            ¿Ya tienes una cuenta? <a href="./login.html">Inicia sesión aquí</a>
          </p>
        </main>

        <aside
          class="auth-image-side"
          aria-label="Imagen decorativa de CitriFresh"
        ></aside>
      </div>
    </div>
  </body>
</html>
